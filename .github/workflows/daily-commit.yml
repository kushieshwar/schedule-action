name: Daily Commit

on:
  schedule:
    - cron: "0 3 * * *"  # Runs daily at 03:00 UTC

  workflow_dispatch:  # Allows manual triggering

jobs:
  commit_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: devarakonda.kushieshwar@straive.com
        run: echo "Hello, world!"
        
      - name: Update Timestamp - devarakonda.kushieshwar@straive.com
        run: echo "Last run: $(date -u)" >> daily-log.txt
     
      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "devarakonda.kushieshwar@straive.com"
          git add daily-log.txt
          git commit -m "Daily update: $(date -u)" || echo "No changes to commit"
          git push
