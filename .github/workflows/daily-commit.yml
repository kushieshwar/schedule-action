name: Daily Commit

on:
  schedule:
    - cron: '30 4 * * *'  # Runs daily at 4:30 AM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "devarakonda.kushieshwar@straive.com"

      - name: Make Changes
        run: |
          echo "Last run: $(date)" > last-run.txt  # Creates/updates a file
          git add last-run.txt

      - name: Commit Changes
        run: |
          git commit -m "Automated commit - $(date)" || echo "No changes to commit"

      - name: Push Changes
        run: git push
